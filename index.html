<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>사계절 플레이리스트</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>사계절 플레이리스트</h1>
</header>

<nav>
    <ul>
        <li><a href="#spring">봄</a></li>
        <li><a href="#summer">여름</a></li>
        <li><a href="#autumn">가을</a></li>
        <li><a href="#winter">겨울</a></li>
    </ul>
</nav>

<div class="tab-content">

    <section id="spring" class="season-section">
        <h2 class="season-title">🌸 봄 플레이리스트</h2>
        <div class="card-container">
            <!-- 봄 노래 카드 -->
            <div class="song-card">봄 노래 1</div>
            <div class="song-card">봄 노래 2</div>
        </div>
    </section>

    <section id="summer" class="season-section">
        <h2 class="season-title">🌊 여름 플레이리스트</h2>
        <div class="card-container">
            <div class="song-card">여름 노래 1</div>
            <div class="song-card">여름 노래 2</div>
        </div>
    </section>

    <section id="autumn" class="season-section">
        <h2 class="season-title">🍁 가을 플레이리스트</h2>
        <div class="card-container">
            <div class="song-card">가을 노래 1</div>
            <div class="song-card">가을 노래 2</div>
        </div>
    </section>

    <section id="winter" class="season-section">
        <h2 class="season-title">❄ 겨울 플레이리스트</h2>
        <div class="card-container">
            <div class="song-card">겨울 노래 1</div>
            <div class="song-card">겨울 노래 2</div>
        </div>
    </section>

</div>

</body>
</html>
